[project]
name = "xrag"
version = "0.1.0"
description = "xRAG"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "accelerate>=1.10.1",
    "datasets>=4.1.1",
    "deepspeed>=0.17.6",
    "flash-attn==2.3.4",
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.7",
    "sentencepiece>=0.2.1",
    "setuptools>=80.9.0",
    "torch",
    "transformers>=4.57.0",
    "wandb>=0.22.1",
]

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
